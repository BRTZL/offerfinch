name: CI

# Every pull request, and on demand. Not on pushes to main: what lands there was checked in its
# pull request, and a release runs these checks again (desktop-release.yml).
#
# Five jobs side by side; the slowest sets the time. Linux runners start at once and are
# plentiful; macOS runners are few and queue, so only what needs macOS runs there: the Codex
# boundary tests (sandbox-exec) and the desktop app's own tests (its diagnostics zips are
# macOS-only). Windows builds and launches the packaged app. "check" gathers all five
# into the one status the main ruleset requires.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Existing diagnostics are budgeted per file/rule/message; new warnings fail.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the exact pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint:ci
      - run: pnpm -r check-types
      - run: pnpm knip

  # The unit tests that run anywhere: core, the store and the runner.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild better-sqlite3
      - name: Unit tests
        run: pnpm --filter @offerfinch/core --filter @offerfinch/db --filter @offerfinch/runner test

  # The unit tests that need macOS: the Codex boundary (sandbox-exec) and the desktop app.
  unit-mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild better-sqlite3
      # Boundary tests use synthetic homes and local capture servers, never a real login.
      - name: Install the tested Codex CLI
        run: |
          mkdir -p "$RUNNER_TEMP/codex-tests"
          pnpm --dir "$RUNNER_TEMP/codex-tests" add @openai/codex@0.166.0 --ignore-scripts
          # The sandbox needs the native executable, not pnpm's shell/Node wrapper.
          node scripts/codex-test-path.mjs "$RUNNER_TEMP/codex-tests/node_modules" >> "$GITHUB_PATH"
      - name: Unit tests
        run: pnpm --filter @offerfinch/local-llm --filter @offerfinch/desktop test

  # Fixture-only safety tests in the runner image's headless Google Chrome.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OFFERFINCH_CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser safety tests
        run: pnpm --filter @offerfinch/core test:browser

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install native binaries
        run: |
          pnpm --filter @offerfinch/desktop exec node -e "require('child_process').execFileSync(process.execPath, [require.resolve('electron/install.js')], {stdio: 'inherit'})"
          pnpm rebuild better-sqlite3
      - name: Unit tests
        run: pnpm --filter @offerfinch/core --filter @offerfinch/db --filter @offerfinch/runner --filter @offerfinch/local-llm --filter @offerfinch/desktop test
      - name: Production build
        run: pnpm --filter @offerfinch/desktop build --production
      # NSIS also produces win-unpacked, which is launched below.
      - name: Package x64 and arm64 apps and installers
        run: pnpm --filter @offerfinch/desktop exec electron-builder --win --x64 --arm64 --publish never
      - name: Verify update metadata
        run: ./scripts/check-windows-update.ps1 -Universal
      - name: Launch packaged app in demo mode
        env:
          OFFERFINCH_SMOKE_EXE: ${{ github.workspace }}\apps\desktop\dist\win-unpacked\OfferFinch.exe
        run: pnpm --filter @offerfinch/desktop exec playwright test -c e2e/playwright.config.ts windows-smoke.spec.ts
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: apps/desktop/dist/*-setup.exe
          if-no-files-found: error
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: apps/desktop/test-results/
          if-no-files-found: warn

  # The one status the main ruleset requires: green only when every job above passed.
  check:
    needs: [static, unit, unit-mac, browser, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed?
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "All passed."
          else
            echo "::error::A job did not pass."
            exit 1
          fi
