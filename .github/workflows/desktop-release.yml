# Releases the macOS and Windows apps: the one entry point for stable and preview releases (docs/releasing.md).
#
# Two ways in, the same jobs:
# - A pushed tag: vX.Y.Z (stable, from `pnpm --filter @offerfinch/desktop release patch`, which
#   bumps package.json and dates the changelog first) or vX.Y.Z-preview.N (preview).
# - The Release button (workflow_dispatch) on main: it works out the version itself, and once the
#   build is signed and notarized commits "Release X.Y.Z" to main (stable only), tags and pushes
#   with the release deploy key, then publishes. A deploy-key push starts workflows, so that tag
#   starts a second run; it waits for this one (one release at a time), finds the release already
#   made and ends green without building ("already released").
#
# released -> resolve -> quality, test, test-mac, e2e (3 shards), build (arm64 + x64 on one runner)
#          -> finalize (button only) -> publish -> notify
#
# The checks and the build run side by side: signing and notarization take as long as the tests,
# and nothing is committed, tagged or published until quality, test, test-mac and build have
# passed. A failed check leaves a signed build as a run artifact and nothing more. The e2e suite
# runs beside them but does not hold a release: a failure keeps its traces as an artifact and the
# notification says so, and the release goes out (slow, uneven macOS runners made it fail on
# timing, not on the app). Only the jobs that need macOS run
# there: the Codex boundary tests (sandbox-exec), the desktop app's tests, the e2e suite and the
# build; macOS runners are few and queue.
#
# Two environments hold the secrets (docs/releasing.md):
# - release: the five signing secrets. Only a real build runs in it, and only from main or a
#   v*.*.* tag (its deployment refs); no reviewer: the Release button is the owner's decision.
# - release-push: RELEASE_DEPLOY_KEY, the deploy key finalize pushes with. Deployment ref: main.
#
# A dry run happens only when the button's dry_run is ticked (a tag push never is one): an ad-hoc
# signed build, no notarization, no environment, the files kept as a run artifact, and nothing
# committed, tagged or published. A real run with a signing secret missing fails; it never turns
# into a dry run.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "stable: installed apps update to it. preview: a prerelease only preview installs see."
        type: choice
        options: [preview, stable]
        default: preview
      bump:
        description: "Stable only: which part of the version goes up. Previews are the next patch's -preview.N."
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Build and test, publish nothing."
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A tag push whose release already exists (draft or published) ends here, green: the Release
  # button pushed that tag and has already published it. Its own job because seeing a draft
  # release takes push access; it runs no repository code and checks nothing out.
  released:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - name: Already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        # Any answer but "found" or "not found" fails, so a GitHub hiccup never starts a rebuild.
        run: |
          released=false
          if [ "$EVENT" = "push" ]; then
            if out=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName 2>&1); then
              released=true
            elif ! grep -q "release not found" <<<"$out"; then
              echo "::error::Could not look up the release for $TAG: $out"
              exit 1
            fi
          fi
          if [ "$released" = "true" ]; then
            msg="$TAG is already released (the Release button published it). Nothing to do."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"

  resolve:
    needs: released
    if: needs.released.outputs.released == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      date: ${{ steps.plan.outputs.date }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      # Full history and tags: the next preview number and the commits since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only the button's dry_run makes a dry run; a tag push is always a real release. The
      # signing secrets live in the release environment, which this job cannot see: build checks
      # them and fails if one is missing.
      - name: Dry run or release
        id: mode
        env:
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "::notice::Dry run (asked for): nothing will be published."
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: The button releases from main
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.dry_run == 'false' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release button on main (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - name: Version, tag and notes
        id: plan
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release-plan.mjs resolve --notes "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 14
      - name: Summary
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          {
            echo "## OfferFinch $VERSION ($CHANNEL)"
            if [ "$DRY_RUN" = "true" ]; then echo "**Dry run: nothing published.**"; fi
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Existing diagnostics are budgeted per file/rule/message; new warnings fail. Also runs the
      # release plan's tests (scripts/release-plan.test.mjs).
      - run: pnpm lint:ci
      - run: pnpm -r check-types
      - run: pnpm knip

  # The unit tests that run anywhere: core, the store and the runner.
  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild better-sqlite3
      - name: Unit tests
        run: pnpm --filter @offerfinch/core --filter @offerfinch/db --filter @offerfinch/runner test

  # The unit tests that need macOS: the Codex boundary (sandbox-exec) and the desktop app.
  test-mac:
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild better-sqlite3
      # Boundary tests use synthetic homes and local capture servers, never a real login.
      - name: Install the tested Codex CLI
        run: |
          mkdir -p "$RUNNER_TEMP/codex-tests"
          pnpm --dir "$RUNNER_TEMP/codex-tests" add @openai/codex@0.166.0 --ignore-scripts
          node scripts/codex-test-path.mjs "$RUNNER_TEMP/codex-tests/node_modules" >> "$GITHUB_PATH"
      - name: Unit tests
        run: pnpm --filter @offerfinch/local-llm --filter @offerfinch/desktop test

  # The suite split three ways by file (Playwright shards); each shard is its own runner.
  # Reported, not required: finalize and publish do not wait for it (the header).
  e2e:
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # With install scripts: Electron downloads its binary, which the tests launch.
      - name: Install
        run: pnpm install --frozen-lockfile
      # Electron's binary, if its install script left it to first use (idempotent).
      - name: Electron
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      # In the background (never on screen, never the active app), each failing test retried once.
      - name: Desktop end-to-end tests (shard ${{ matrix.shard }} of 3)
        env:
          OFFERFINCH_TEST_BACKGROUND: "1"
        run: pnpm --filter @offerfinch/desktop e2e --retries=1 --shard=${{ matrix.shard }}/3
      - name: Keep the traces (failures)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  # A real build runs in the release environment (the signing secrets); a dry run in none: an
  # empty environment name means no environment, so no signing secret and no deployment. It runs
  # beside the checks; finalize and publish wait for all of them.
  build:
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ needs.resolve.outputs.dry_run == 'false' && 'release' || '' }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
    steps:
      - name: The signing secrets
        if: env.DRY_RUN == 'false'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for name in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in the release environment:$missing (docs/releasing.md, One-time setup). Nothing was published; for a test build, run the button with dry_run."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # Install scripts are skipped: better-sqlite3 ships N-API prebuilds for both Mac arches,
      # and electron-builder downloads its own Electron for each arch.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The version goes into the build here: package.json, and for a stable release from the
      # button the dated changelog the app bundles (finalize commits the same change).
      - name: Stamp the version
        env:
          RELEASE_DATE: ${{ needs.resolve.outputs.date }}
        run: node scripts/release-plan.mjs apply "$VERSION" --date "$RELEASE_DATE"

      # The App Store Connect key is written to a file for notarization and removed afterwards.
      - name: Notarization key
        if: env.DRY_RUN == 'false'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: env.DRY_RUN == 'false'
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node scripts/build.mjs --production
          # Stamped so the app turns on updates; local builds lack it (main/app-updates.ts releaseBuild).
          pnpm exec electron-builder --mac --arm64 --x64 --publish never -c.extraMetadata.offerfinchRelease=true

      # As `pnpm dist` builds locally: ad-hoc signed (arm64 needs a signature to launch at all),
      # not notarized, and without the release stamp, so it never tries to update itself.
      - name: Build (dry run, ad-hoc signed)
        if: env.DRY_RUN == 'true'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node scripts/build.mjs --production
          pnpm exec electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false

      - name: Verify the signature and notarization
        if: env.DRY_RUN == 'false'
        working-directory: apps/desktop/dist
        # Required: the signature (local), the Developer ID authority (local), the stapled ticket
        # (local: codesign reports it) and Gatekeeper's verdict (online, three tries). stapler
        # validate also asks Apple's ticket server; from the runner that lookup can drop the
        # connection (NSURLErrorDomain -1005) for a correctly stapled app, so after three tries it
        # warns instead of failing: the stapled ticket and Gatekeeper are already checked.
        run: |
          online() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::'$*' failed (try $attempt of 3)"
              sleep $((attempt * 15))
            done
            return 1
          }
          for app in mac/OfferFinch.app mac-arm64/OfferFinch.app; do
            codesign --verify --deep --strict "$app"
            details=$(codesign -dvvvv "$app" 2>&1)
            grep -q "Authority=Developer ID Application" <<<"$details"
            grep -q "Notarization Ticket=stapled" <<<"$details" || {
              echo "::error::$app has no stapled notarization ticket"
              exit 1
            }
            online spctl --assess --type execute -v "$app"
            online xcrun stapler validate "$app" ||
              echo "::warning::stapler validate could not reach Apple for $app; the stapled ticket and Gatekeeper passed"
          done

      # The packaged arm64 app opens its window in background test mode against a temporary
      # data folder (the runner is arm64; the x64 build shares everything but the binaries).
      - name: Launch check
        working-directory: apps/desktop
        run: node scripts/smoke-packaged.mjs dist/mac-arm64/OfferFinch.app

      - name: The update file
        working-directory: apps/desktop/dist
        run: |
          count=$(find . -maxdepth 1 -name '*-mac.yml' | wc -l | tr -d ' ')
          test "$count" = 1 || { echo "::error::Expected one *-mac.yml, found $count"; ls; exit 1; }
          cat ./*-mac.yml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offerfinch-mac
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/OfferFinch-*.dmg
            apps/desktop/dist/OfferFinch-*-mac.zip
            apps/desktop/dist/OfferFinch-*-mac.zip.blockmap
            apps/desktop/dist/*-mac.yml

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # Unsigned NSIS installers; the GitHub provider embeds app-update.yml on both arches.
  build-windows:
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stamp the version
        env:
          RELEASE_DATE: ${{ needs.resolve.outputs.date }}
        run: node scripts/release-plan.mjs apply "$VERSION" --date "$RELEASE_DATE"
      - name: Build Windows installers
        working-directory: apps/desktop
        run: |
          node scripts/build.mjs --production
          stamp=()
          if [ "$DRY_RUN" = "false" ]; then stamp=(-c.extraMetadata.offerfinchRelease=true); fi
          pnpm exec electron-builder --win --x64 --arm64 --publish never "${stamp[@]}"
      - name: Verify update metadata
        shell: pwsh
        run: ./scripts/check-windows-update.ps1 -Channel '${{ needs.resolve.outputs.channel }}' -Universal
      - name: Launch check
        env:
          OFFERFINCH_SMOKE_EXE: ${{ github.workspace }}\apps\desktop\dist\win-unpacked\OfferFinch.exe
        run: pnpm --filter @offerfinch/desktop exec playwright test -c e2e/playwright.config.ts windows-smoke.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offerfinch-windows
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/desktop/dist/OfferFinch-*-setup.exe
            apps/desktop/dist/OfferFinch-*-setup.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/preview.yml

  # The button only: commit "Release X.Y.Z" (stable) and push it with the tag, atomically. It
  # pushes the commit this run built, so it fails rather than release if main moved meanwhile.
  # It pushes over SSH with the release deploy key (release-push environment), which may bypass
  # the rulesets; the workflow's token never writes to main or creates a tag.
  finalize:
    needs: [resolve, quality, test, test-mac, build, build-windows]
    if: github.event_name == 'workflow_dispatch' && needs.resolve.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-push
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_DATE: ${{ needs.resolve.outputs.date }}
    steps:
      # Checked first: with an empty ssh-key, checkout would quietly use the token over HTTPS.
      - name: The deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$RELEASE_DEPLOY_KEY" ]; then
            echo "::error::RELEASE_DEPLOY_KEY is not set in the release-push environment (docs/releasing.md, One-time setup). The build passed; nothing was pushed or published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = "stable" ]; then
            node scripts/release-plan.mjs apply "$VERSION" --date "$RELEASE_DATE"
            git add apps/desktop/package.json apps/desktop/CHANGELOG.md
            git commit -m "Release $VERSION"
            git tag -a "$TAG" -m "OfferFinch $VERSION"
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$TAG"
          else
            # Previews never change main: the tag marks the commit that was built.
            git tag -a "$TAG" -m "OfferFinch $VERSION"
            git push origin "refs/tags/$TAG"
          fi

  publish:
    needs: [resolve, quality, test, test-mac, build, build-windows, finalize]
    if: >-
      !cancelled() && needs.resolve.outputs.dry_run == 'false' &&
      needs.quality.result == 'success' && needs.test.result == 'success' &&
      needs['test-mac'].result == 'success' &&
      needs.build.result == 'success' && needs['build-windows'].result == 'success' &&
      (needs.finalize.result == 'success' || needs.finalize.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offerfinch-mac
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: offerfinch-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        working-directory: dist
        # A draft first, every file uploaded and checked, then published: installed apps never see a
        # release with missing update files, and a re-run resumes the same draft instead of failing.
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            # Installed stable apps read the latest release, which a prerelease never is.
            channel=(--prerelease --latest=false)
            manifest=preview
          else
            channel=(--latest)
            manifest=latest
          fi
          shopt -s nullglob
          files=(OfferFinch-*.dmg OfferFinch-*-mac.zip OfferFinch-*-mac.zip.blockmap ./*-mac.yml OfferFinch-*-setup.exe OfferFinch-*-setup.exe.blockmap "./$manifest.yml")
          # Mac: 7 files. Windows: combined + two arch installers, blockmaps, manifest.
          if [ "${#files[@]}" -ne 14 ]; then
            echo "::error::Expected 14 release files, found ${#files[@]}"; ls -la; exit 1
          fi
          repo=(-R "$GITHUB_REPOSITORY")
          if state=$(gh release view "$TAG" "${repo[@]}" --json isDraft,tagName 2>/dev/null); then
            if [ "$(jq -r .tagName <<<"$state")" != "$TAG" ]; then
              echo "::error::A release exists that is not for $TAG"; exit 1
            fi
            echo "Resuming the release for $TAG (draft: $(jq -r .isDraft <<<"$state"))."
          else
            gh release create "$TAG" "${repo[@]}" --verify-tag --draft \
              --title "OfferFinch $VERSION" --notes-file ../notes/release-notes.md
          fi
          gh release upload "$TAG" "${repo[@]}" --clobber "${files[@]}"
          for f in "${files[@]}"; do
            name=$(basename "$f")
            size=$(stat -c %s "$f")
            got=$(gh release view "$TAG" "${repo[@]}" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .size")
            if [ "$got" != "$size" ]; then
              echo "::error::$name is not attached in full (${got:-0} of $size bytes)"; exit 1
            fi
          done
          gh release edit "$TAG" "${repo[@]}" --draft=false \
            --title "OfferFinch $VERSION" --notes-file ../notes/release-notes.md "${channel[@]}"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  # One message per run. The topic comes from the NTFY_TOPIC secret: in a public repository a
  # topic in the workflow file would let anyone post to it. Nothing private goes in the message.
  notify:
    needs:
      - released
      - resolve
      - quality
      - test
      - test-mac
      - e2e
      - build
      - build-windows
      - finalize
      - publish
    if: always() && needs.released.outputs.released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VERSION: ${{ needs.resolve.outputs.version || 'unknown version' }}
          CHANNEL: ${{ needs.resolve.outputs.channel || 'release' }}
          TAG: ${{ needs.resolve.outputs.tag }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
          # Every job's result; FAILED below leaves e2e out (it does not hold a release).
          NEEDS: ${{ toJSON(needs) }}
          E2E: ${{ needs.e2e.result }}
          PUBLISHED: ${{ needs.publish.result == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.resolve.outputs.tag }}
        run: |
          FAILED=$(jq -r '[to_entries[] | select(.key != "e2e") | .value.result]
            | any(. == "failure" or . == "cancelled")' <<< "$NEEDS")
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::notice::NTFY_TOPIC is not set: no notification."
            exit 0
          fi
          if [ "$FAILED" = "true" ]; then
            title="OfferFinch $VERSION release failed"; tags="x"; priority=5; url="$RUN_URL"
            body="The **$CHANNEL** release stopped. The run shows which job."
          elif [ "$PUBLISHED" = "true" ]; then
            title="OfferFinch $VERSION released"; tags="rocket,white_check_mark"; priority=3; url="$RELEASE_URL"
            body="**$TAG** ($CHANNEL) is published."
          else
            title="OfferFinch $VERSION dry run passed"; tags="test_tube"; priority=2; url="$RUN_URL"
            body="Dry run: nothing published. The build is a run artifact."
          fi
          if [ "$E2E" != "success" ] && [ "$E2E" != "skipped" ]; then
            body="$body e2e: **$E2E** (not blocking); the traces are the run's e2e-results artifacts."
            [ "$FAILED" = "true" ] || tags="$tags,warning"
          fi
          curl -sS --max-time 20 \
            -H "Title: $title" -H "Tags: $tags" -H "Priority: $priority" -H "Markdown: yes" \
            -H "Click: $url" -H "Actions: view, Open, $url" \
            -d "$body" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null || echo "::warning::ntfy did not accept the message"
