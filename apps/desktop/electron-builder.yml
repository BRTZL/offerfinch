# Release builds are signed with a Developer ID and notarized (CI: CSC_LINK and the App Store
# Connect key, see docs/releasing.md), which macOS requires for over-the-air updates. Local builds
# (pnpm dist) are ad-hoc signed and cannot update themselves.
# Stable from OfferFinch on: macOS ties notification permission, the login item and the Keychain
# item to it.
appId: app.offerfinch.desktop
productName: OfferFinch
copyright: OfferFinch contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - "!out/meta.json"
  - "!out/**/*.map"
  - package.json
  # Only what runs: better-sqlite3's JS and platform prebuilds, Playwright's core without
  # its trace viewer and recorder UIs.
  - "!**/node_modules/better-sqlite3/{deps,src,build,docs}/**"
  - "!**/node_modules/better-sqlite3/binding.gyp"
  - "!**/node_modules/playwright-core/lib/vite/**"
  - "!**/node_modules/playwright-core/lib/webp_codec.wasm"
extraResources:
  - from: assets
    to: assets
  # What's new reads the release notes from here: bundled, so they show offline and need no
  # access to the (private) repository.
  - from: CHANGELOG.md
    to: CHANGELOG.md
asar: true
# Native and self-locating modules: better-sqlite3's N-API prebuilds (both arches) and Playwright.
# The worker's ESM bundle too: a utility process cannot load an ESM entry from inside the asar.
asarUnpack:
  - out/worker/**
  - node_modules/better-sqlite3/**
  - node_modules/playwright-core/**
npmRebuild: false
nodeGypRebuild: false
electronLanguages: [en]
mac:
  files:
    - "!**/node_modules/better-sqlite3/prebuilds/{linux,linuxmusl,win32}-*"
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what over-the-air updates download (Squirrel.Mac reads zips, not DMGs).
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  # Every size rendered on its own (16 px hinted), for macOS 13-15. macOS 26+ reads the Icon
  # Composer icon from Assets.car (CFBundleIconName below); without it, it shows this .icns on a
  # grey plate at small sizes. Both from scripts/icons.mjs.
  icon: build/icon.icns
  # Signed as the app (app.offerfinch.desktop), never left with Electron's own linker signature
  # ("Electron"): macOS refuses notifications to a bundle whose code identity does not match its
  # id, without asking (UNErrorDomain 1; verified 2026-11-02). Releases: the Developer ID from
  # CSC_LINK, hardened runtime, notarized with APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER.
  # Local builds pass -c.mac.identity=- (ad-hoc) and skip notarization (package.json "dist").
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  gatekeeperAssess: false
  minimumSystemVersion: "13.0"
  extendInfo:
    NSHumanReadableCopyright: Runs on this Mac. Nothing is sent without your approval.
    CFBundleIconName: OfferFinch
  extraResources:
    - from: build/Assets.car
      to: Assets.car
    # The notification chirp: macOS finds a notification sound by name in the bundle's Resources.
    - from: build/chirp.aiff
      to: chirp.aiff
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # electron-builder converts this 1024px source to ICO.
  icon: build/icon.png
  files:
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*"
  # Windows releases and updates are not published yet.
  publish: null
nsis:
  oneClick: true
  perMachine: false
  artifactName: OfferFinch-${version}-${arch}-setup.exe
# Window art and volume icon: rendered by scripts/icons.mjs (docs/brand).
dmg:
  title: OfferFinch ${version}
  artifactName: OfferFinch-${version}-${arch}.dmg
  writeUpdateInfo: false
  background: build/background.tiff
  icon: build/volume.icns
  iconSize: 96
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 196
      type: file
    - x: 390
      y: 196
      type: link
      path: /Applications
# Over-the-air updates read latest-mac.yml and the zips from this repository's GitHub Releases.
publish:
  provider: github
  owner: BRTZL # public-ok: the owner of the public release repository
  repo: offerfinch
  releaseType: release
